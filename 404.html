<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
/* works at the domain root AND on GitHub Pages project sites */
var seg = location.hostname.slice(-10) === '.github.io' ? (location.pathname.split('/')[1] || '') : '';
document.write('<base href="/' + (seg ? seg + '/' : '') + '">');
</script>
<title>A quiet detour · Temple of Sun</title>
<meta name="robots" content="noindex">
<noscript><meta http-equiv="refresh" content="15;url=/"></noscript>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
</head>
<body>

<header data-site-header></header>
<div data-site-mobile></div>

<main>
  <section class="center" style="min-height:62vh;display:flex;align-items:center">
    <div class="wrap-text" style="width:100%">
      <svg width="54" height="54" viewBox="0 0 54 54" fill="none" aria-hidden="true" style="margin:0 auto 26px;display:block">
        <circle cx="27" cy="27" r="10" stroke="var(--gold)" stroke-width="1.5"/>
        <g stroke="var(--gold)" stroke-width="1.2" stroke-linecap="round" opacity=".7">
          <path d="M27 5v7M27 42v7M5 27h7M42 27h7"/>
          <path d="M11.4 11.4l5 5M37.6 37.6l5 5M42.6 11.4l-5 5M16.4 37.6l-5 5"/>
        </g>
      </svg>
      <span class="label">A quiet detour</span>
      <h1 class="serif" style="font-size:clamp(34px,5vw,54px);margin-top:14px">This path doesn&#39;t lead anywhere</h1>
      <p class="italic" style="color:var(--clay-ink);font-size:clamp(18px,2.2vw,22px);margin-top:12px">even wandering is part of the way</p>
      <p style="margin:26px auto 0;max-width:46ch">The page you were looking for has moved on, or never was. Breathe once, and let me walk you back.</p>
      <div style="display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:36px">
        <a class="btn btn-solid" href="index.html">Return home</a>
        <a class="btn" href="collections.html">The collections</a>
        <a class="btn" href="contact.html">Write to Peter</a>
      </div>
      <p id="homeCount" style="font-size:13.5px;color:var(--sage);margin-top:30px">Taking you home in <span id="homeSecs">15</span> seconds</p>
    </div>
  </section>
</main>

<footer data-site-footer></footer>
<script src="js/site.js"></script>
<script>
(function(){
  var s = 15;
  var el = document.getElementById('homeSecs');
  var t = setInterval(function(){
    s--;
    if(el) el.textContent = s;
    if(s <= 0){ clearInterval(t); window.location.replace('index.html'); }
  }, 1000);
})();
</script>
</body>
</html>
